<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 585" role="img" aria-label="A red-black tree beside the 2-3-4 tree it encodes, before and after inserting 80, showing that a color flip is a 4-node split" style="max-width:100%;height:auto;color:inherit">
  <style>
    .nb    { fill: none; stroke: currentColor; stroke-width: 2.2; }
    .nr    { fill: #ef4444; fill-opacity: .14; stroke: #ef4444; stroke-width: 2.2; }
    .e     { stroke: currentColor; stroke-width: 1.6; opacity: .65; }
    .er    { stroke: #ef4444; stroke-width: 3; }
    .hull  { fill: none; stroke: #3b82f6; stroke-opacity: .16; stroke-width: 50; stroke-linecap: round; stroke-linejoin: round; }
    .hullc { fill: #3b82f6; fill-opacity: .16; stroke: none; }
    .cb    { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .cr    { fill: #ef4444; fill-opacity: .14; stroke: #ef4444; stroke-width: 1.6; }
    .t     { fill: currentColor; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .k     { fill: currentColor; font: 600 13px ui-monospace, monospace; text-anchor: middle; }
    .cap   { fill: currentColor; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .note  { fill: currentColor; font: 11px system-ui, sans-serif; opacity: .75; text-anchor: middle; }
    .arw   { stroke: #10b981; stroke-width: 2.5; fill: none; }
  </style>
  <text class="cap" x="175" y="22">Red-black tree</text>
  <text class="cap" x="530" y="22">The 2-3-4 tree it encodes</text>
  <!-- row 1: groups (one per 2-3-4 node) -->
  <path class="hull" d="M95,130 L175,70"/>
  <path class="hull" d="M215,195 L255,130 L295,195"/>
  <circle class="hullc" cx="50" cy="195" r="24"/>
  <circle class="hullc" cx="140" cy="195" r="24"/>
  <line class="er" x1="161" y1="80" x2="109" y2="120"/>
  <line class="e" x1="189" y1="80" x2="241" y2="120"/>
  <line class="e" x1="85" y1="144" x2="60" y2="181"/>
  <line class="e" x1="105" y1="144" x2="130" y2="181"/>
  <line class="er" x1="246" y1="144" x2="224" y2="181"/>
  <line class="er" x1="264" y1="144" x2="286" y2="181"/>
  <circle class="nb" cx="175" cy="70" r="17"/><text class="t" x="175" y="75">40</text>
  <circle class="nr" cx="95" cy="130" r="17"/><text class="t" x="95" y="135">20</text>
  <circle class="nb" cx="255" cy="130" r="17"/><text class="t" x="255" y="135">60</text>
  <circle class="nb" cx="50" cy="195" r="17"/><text class="t" x="50" y="200">10</text>
  <circle class="nb" cx="140" cy="195" r="17"/><text class="t" x="140" y="200">30</text>
  <circle class="nr" cx="215" cy="195" r="17"/><text class="t" x="215" y="200">50</text>
  <circle class="nr" cx="295" cy="195" r="17"/><text class="t" x="295" y="200">70</text>
  <!-- row 1: 2-3-4 tree -->
  <rect class="cr" x="496" y="70" width="34" height="28"/><text class="k" x="513" y="89">20</text>
  <rect class="cb" x="530" y="70" width="34" height="28"/><text class="k" x="547" y="89">40</text>
  <rect class="cb" x="393" y="160" width="34" height="28"/><text class="k" x="410" y="179">10</text>
  <rect class="cb" x="473" y="160" width="34" height="28"/><text class="k" x="490" y="179">30</text>
  <rect class="cr" x="564" y="160" width="34" height="28"/><text class="k" x="581" y="179">50</text>
  <rect class="cb" x="598" y="160" width="34" height="28"/><text class="k" x="615" y="179">60</text>
  <rect class="cr" x="632" y="160" width="34" height="28"/><text class="k" x="649" y="179">70</text>
  <line class="e" x1="496" y1="98" x2="410" y2="160"/>
  <line class="e" x1="530" y1="98" x2="490" y2="160"/>
  <line class="e" x1="564" y1="98" x2="615" y2="160"/>
  <text class="note" x="530" y="222">2-node = black node alone · 3-node = black + one red child</text>
  <text class="note" x="530" y="238">4-node = black + two red children</text>
  <path class="arw" d="M350,250 L350,292"/>
  <path class="arw" d="M341,280 L350,292 L359,280"/>
  <text class="note" x="350" y="314">insert 80 below red 70: recolor 50, 60, 70 (no rotation) = split the 4-node, 60 moves up</text>
  <path class="hull" d="M95,420 L175,360 L255,420"/>
  <path class="hull" d="M295,485 L335,550"/>
  <circle class="hullc" cx="50" cy="485" r="24"/>
  <circle class="hullc" cx="140" cy="485" r="24"/>
  <circle class="hullc" cx="215" cy="485" r="24"/>
  <line class="er" x1="161" y1="370" x2="109" y2="410"/>
  <line class="er" x1="189" y1="370" x2="241" y2="410"/>
  <line class="e" x1="85" y1="434" x2="60" y2="471"/>
  <line class="e" x1="105" y1="434" x2="130" y2="471"/>
  <line class="e" x1="246" y1="434" x2="224" y2="471"/>
  <line class="e" x1="264" y1="434" x2="286" y2="471"/>
  <line class="er" x1="304" y1="499" x2="326" y2="536"/>
  <circle class="nb" cx="175" cy="360" r="17"/><text class="t" x="175" y="365">40</text>
  <circle class="nr" cx="95" cy="420" r="17"/><text class="t" x="95" y="425">20</text>
  <circle class="nr" cx="255" cy="420" r="17"/><text class="t" x="255" y="425">60</text>
  <circle class="nb" cx="50" cy="485" r="17"/><text class="t" x="50" y="490">10</text>
  <circle class="nb" cx="140" cy="485" r="17"/><text class="t" x="140" y="490">30</text>
  <circle class="nb" cx="215" cy="485" r="17"/><text class="t" x="215" y="490">50</text>
  <circle class="nb" cx="295" cy="485" r="17"/><text class="t" x="295" y="490">70</text>
  <circle class="nr" cx="335" cy="550" r="17"/><text class="t" x="335" y="555">80</text>
  <rect class="cr" x="479" y="360" width="34" height="28"/><text class="k" x="496" y="379">20</text>
  <rect class="cb" x="513" y="360" width="34" height="28"/><text class="k" x="530" y="379">40</text>
  <rect class="cr" x="547" y="360" width="34" height="28"/><text class="k" x="564" y="379">60</text>
  <rect class="cb" x="383" y="450" width="34" height="28"/><text class="k" x="400" y="469">10</text>
  <rect class="cb" x="451" y="450" width="34" height="28"/><text class="k" x="468" y="469">30</text>
  <rect class="cb" x="519" y="450" width="34" height="28"/><text class="k" x="536" y="469">50</text>
  <rect class="cb" x="596" y="450" width="34" height="28"/><text class="k" x="613" y="469">70</text>
  <rect class="cr" x="630" y="450" width="34" height="28"/><text class="k" x="647" y="469">80</text>
  <line class="e" x1="479" y1="388" x2="400" y2="450"/>
  <line class="e" x1="513" y1="388" x2="468" y2="450"/>
  <line class="e" x1="547" y1="388" x2="536" y2="450"/>
  <line class="e" x1="581" y1="388" x2="630" y2="450"/>
  <text class="note" x="530" y="512">Every root-to-NIL path crosses 2 black nodes,</text>
  <text class="note" x="530" y="528">so every 2-3-4 leaf is at depth 2.</text>
</svg>
