<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="A piece table for the text the quick brown fox jumps: four pieces pointing into a read-only original buffer and an append-only add buffer" style="max-width:100%;height:auto;color:inherit">
  <style>
    .cell { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .55; }
    .o    { fill: #3b82f6; fill-opacity: .16; stroke: #3b82f6; stroke-width: 1.8; }
    .a    { fill: #10b981; fill-opacity: .16; stroke: #10b981; stroke-width: 1.8; }
    .dead { fill: #ef4444; fill-opacity: .10; stroke: #ef4444; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .k    { fill: currentColor; font: 600 14px ui-monospace, monospace; text-anchor: middle; }
    .ix   { fill: currentColor; font: 10px ui-monospace, monospace; text-anchor: middle; opacity: .6; }
    .pc   { fill: currentColor; font: 600 13px ui-monospace, monospace; text-anchor: middle; }
    .cap  { fill: currentColor; font: 600 13px system-ui, sans-serif; }
    .note { fill: currentColor; font: 11px system-ui, sans-serif; opacity: .72; }
    .ao   { stroke: #3b82f6; stroke-width: 1.8; fill: none; }
    .aa   { stroke: #10b981; stroke-width: 1.8; fill: none; }
  </style>
