<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-label="A van Emde Boas tree over the universe 0 to 15 holding 2, 3, 9, 13, 14 and 15: the minimum 2 is kept at the top, the summary records the nonempty clusters 0, 2 and 3, cluster 1 is empty and not stored, and successor of 9 goes through the summary to cluster 3" style="max-width:100%;height:auto;color:inherit">
  <style>
    .box  { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .gone { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-dasharray: 5 4; opacity: .5; }
    .cell { fill: none; stroke: currentColor; stroke-width: 1.1; opacity: .7; }
    .on   { fill: #3b82f6; fill-opacity: .22; stroke: #3b82f6; stroke-width: 1.6; }
    .top  { fill: #f59e0b; fill-opacity: .26; stroke: #f59e0b; stroke-width: 2; }
    .e    { stroke: currentColor; stroke-width: 1.3; opacity: .5; fill: none; }
    .ttl  { fill: currentColor; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .t    { fill: currentColor; font: 12px system-ui, sans-serif; text-anchor: middle; }
    .k    { fill: currentColor; font: 600 12px ui-monospace, monospace; text-anchor: middle; }
    .lab  { fill: currentColor; font: 11px ui-monospace, monospace; text-anchor: middle; opacity: .7; }
    .note { fill: currentColor; font: 11px system-ui, sans-serif; opacity: .75; }
    .amb  { fill: #f59e0b; font: 600 12px system-ui, sans-serif; }
    .stp  { fill: none; stroke: #10b981; stroke-width: 2; }
    .sn   { fill: #10b981; font: 700 11px system-ui, sans-serif; text-anchor: middle; }
    .st   { fill: currentColor; font: 12px system-ui, sans-serif; }
  </style>
  <!-- top level -->
  <rect class="box" x="250" y="14" width="220" height="52" rx="4"/>
  <text class="ttl" x="360" y="35">V (u = 16)</text>
  <text class="t" x="360" y="55"><tspan class="amb">min = 2</tspan>, max = 15</text>
  <text class="note" x="484" y="34">2 is stored only here,</text>
  <text class="note" x="484" y="49">not in cluster 0</text>
  <line class="e" x1="300" y1="66" x2="76" y2="118"/>
  <line class="e" x1="330" y1="66" x2="214" y2="118"/>
  <line class="e" x1="355" y1="66" x2="354" y2="118"/>
  <line class="e" x1="390" y1="66" x2="494" y2="118"/>
  <line class="e" x1="420" y1="66" x2="634" y2="118"/>
  <!-- summary -->
  <rect class="box" x="16" y="118" width="120" height="84" rx="4"/>
  <text class="ttl" x="70" y="136">summary</text>
  <rect class="on" x="28" y="146" width="24" height="22"/>
  <rect class="cell" x="52" y="146" width="24" height="22"/>
  <rect class="on" x="76" y="146" width="24" height="22"/>
  <rect class="on" x="100" y="146" width="24" height="22"/>
  <text class="lab" x="40" y="184">0</text><text class="lab" x="64" y="184">1</text><text class="lab" x="88" y="184">2</text><text class="lab" x="112" y="184">3</text>
  <text class="note" x="30" y="197">nonempty clusters</text>
  <!-- clusters -->
  <rect class="box" x="150" y="118" width="128" height="84" rx="4"/>
  <text class="ttl" x="214" y="136">cluster 0</text>
  <text class="t" x="214" y="158">min 3, max 3</text>
  <text class="t" x="214" y="178">holds low 3</text>
  <rect class="gone" x="290" y="118" width="128" height="84" rx="4"/>
  <text class="ttl" x="354" y="136" opacity=".6">cluster 1</text>
  <text class="t" x="354" y="158" opacity=".6">empty: no entry</text>
  <text class="t" x="354" y="178" opacity=".6">in the hash table</text>
  <rect class="box" x="430" y="118" width="128" height="84" rx="4"/>
  <text class="ttl" x="494" y="136">cluster 2</text>
  <text class="t" x="494" y="158">min 1, max 1</text>
  <text class="t" x="494" y="178">holds low 1</text>
  <rect class="box" x="570" y="118" width="128" height="84" rx="4"/>
  <text class="ttl" x="634" y="136">cluster 3</text>
  <text class="t" x="634" y="158">min 1, max 3</text>
  <text class="t" x="634" y="178">holds lows 1, 2, 3</text>
  <!-- step markers -->
  <circle class="stp" cx="552" cy="124" r="9"/><text class="sn" x="552" y="128">1</text>
  <circle class="stp" cx="130" cy="124" r="9"/><text class="sn" x="130" y="128">2</text>
  <circle class="stp" cx="692" cy="124" r="9"/><text class="sn" x="692" y="128">3</text>
  <!-- links to the universe -->
  <line class="e" x1="214" y1="202" x2="214" y2="246"/>
  <line class="e" x1="354" y1="202" x2="354" y2="246"/>
  <line class="e" x1="494" y1="202" x2="494" y2="246"/>
  <line class="e" x1="634" y1="202" x2="634" y2="246"/>
  <!-- universe row: key x sits at 150 + 140*high + 32*low -->
  <text class="note" x="16" y="262">keys 0 to 15,</text>
  <text class="note" x="16" y="277">grouped by high(x)</text>
  <rect class="cell" x="150" y="248" width="32" height="30"/><text class="k" x="166" y="268">0</text>
  <rect class="cell" x="182" y="248" width="32" height="30"/><text class="k" x="198" y="268">1</text>
  <rect class="top"  x="214" y="248" width="32" height="30"/><text class="k" x="230" y="268">2</text>
  <rect class="on"   x="246" y="248" width="32" height="30"/><text class="k" x="262" y="268">3</text>
  <rect class="cell" x="290" y="248" width="32" height="30"/><text class="k" x="306" y="268">4</text>
  <rect class="cell" x="322" y="248" width="32" height="30"/><text class="k" x="338" y="268">5</text>
  <rect class="cell" x="354" y="248" width="32" height="30"/><text class="k" x="370" y="268">6</text>
  <rect class="cell" x="386" y="248" width="32" height="30"/><text class="k" x="402" y="268">7</text>
  <rect class="cell" x="430" y="248" width="32" height="30"/><text class="k" x="446" y="268">8</text>
  <rect class="on"   x="462" y="248" width="32" height="30"/><text class="k" x="478" y="268">9</text>
  <rect class="cell" x="494" y="248" width="32" height="30"/><text class="k" x="510" y="268">10</text>
  <rect class="cell" x="526" y="248" width="32" height="30"/><text class="k" x="542" y="268">11</text>
  <rect class="cell" x="570" y="248" width="32" height="30"/><text class="k" x="586" y="268">12</text>
  <rect class="on"   x="602" y="248" width="32" height="30"/><text class="k" x="618" y="268">13</text>
  <rect class="on"   x="634" y="248" width="32" height="30"/><text class="k" x="650" y="268">14</text>
  <rect class="on"   x="666" y="248" width="32" height="30"/><text class="k" x="682" y="268">15</text>
  <text class="lab" x="166" y="294">low 0</text><text class="lab" x="198" y="294">1</text><text class="lab" x="230" y="294">2</text><text class="lab" x="262" y="294">3</text>
  <text class="lab" x="214" y="310">high 0</text><text class="lab" x="354" y="310">high 1</text><text class="lab" x="494" y="310">high 2</text><text class="lab" x="634" y="310">high 3</text>
  <!-- key split and the successor walk -->
  <text class="st" x="16" y="340">x = 9 = 10 01 in binary: high(9) = 2 picks the cluster, low(9) = 1 is the position inside it.</text>
  <text class="st" x="16" y="364" font-weight="600">successor(9):</text>
  <circle class="stp" cx="25" cy="382" r="9"/><text class="sn" x="25" y="386">1</text>
  <text class="st" x="42" y="386">cluster 2 has max 1 = low(9): nothing larger in this cluster.</text>
  <circle class="stp" cx="25" cy="404" r="9"/><text class="sn" x="25" y="408">2</text>
  <text class="st" x="42" y="408">summary.successor(2) = 3: the next nonempty cluster (one recursive call, on u = 4).</text>
  <circle class="stp" cx="25" cy="426" r="9"/><text class="sn" x="25" y="430">3</text>
  <text class="st" x="42" y="430">cluster 3's min is 1, read in O(1): the answer is 3 · 4 + 1 = 13.</text>
</svg>
