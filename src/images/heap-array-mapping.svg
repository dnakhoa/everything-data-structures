<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" role="img" aria-label="A max-heap drawn as a tree and as an array: node i has parent (i minus 1) over 2 and children 2i plus 1 and 2i plus 2, and the array is the tree read level by level" style="max-width:100%;height:auto;color:inherit">
  <style>
    .n    { fill: none; stroke: currentColor; stroke-width: 1.8; }
    .cell { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .me   { fill: #3b82f6; fill-opacity: .16; stroke: #3b82f6; stroke-width: 2.4; }
    .par  { fill: #f59e0b; fill-opacity: .20; stroke: #f59e0b; stroke-width: 2.4; }
    .kid  { fill: #10b981; fill-opacity: .16; stroke: #10b981; stroke-width: 2.4; }
    .e    { stroke: currentColor; stroke-width: 1.5; opacity: .6; }
    .k    { fill: currentColor; font: 600 13px ui-monospace, monospace; text-anchor: middle; }
    .idx  { fill: currentColor; font: 11px ui-monospace, monospace; text-anchor: middle; opacity: .7; }
    .cap  { fill: currentColor; font: 600 13px system-ui, sans-serif; }
    .note { fill: currentColor; font: 12px system-ui, sans-serif; opacity: .8; }
    .br   { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: .55; }
    .lvl  { fill: currentColor; font: 11px system-ui, sans-serif; text-anchor: middle; opacity: .7; }
  </style>
  <text class="cap" x="16" y="22">The array is the tree read level by level, left to right</text>
  <!-- edges -->
  <line class="e" x1="340" y1="62" x2="190" y2="110"/>
  <line class="e" x1="340" y1="62" x2="490" y2="110"/>
  <line class="e" x1="190" y1="122" x2="115" y2="170"/>
  <line class="e" x1="190" y1="122" x2="265" y2="170"/>
  <line class="e" x1="490" y1="122" x2="415" y2="170"/>
  <line class="e" x1="490" y1="122" x2="565" y2="170"/>
  <line class="e" x1="115" y1="182" x2="77" y2="230"/>
  <line class="e" x1="115" y1="182" x2="153" y2="230"/>
  <!-- nodes: value inside, index beside -->
  <circle class="par" cx="340" cy="56" r="18"/><text class="k" x="340" y="61">90</text><text class="idx" x="376" y="50">i=0</text>
  <circle class="me"  cx="190" cy="116" r="18"/><text class="k" x="190" y="121">80</text><text class="idx" x="226" y="110">i=1</text>
  <circle class="n"   cx="490" cy="116" r="18"/><text class="k" x="490" y="121">70</text><text class="idx" x="526" y="110">i=2</text>
  <circle class="kid" cx="115" cy="176" r="18"/><text class="k" x="115" y="181">50</text><text class="idx" x="151" y="170">i=3</text>
  <circle class="kid" cx="265" cy="176" r="18"/><text class="k" x="265" y="181">40</text><text class="idx" x="301" y="170">i=4</text>
  <circle class="n"   cx="415" cy="176" r="18"/><text class="k" x="415" y="181">60</text><text class="idx" x="451" y="170">i=5</text>
  <circle class="n"   cx="565" cy="176" r="18"/><text class="k" x="565" y="181">30</text><text class="idx" x="601" y="170">i=6</text>
  <circle class="n"   cx="77"  cy="236" r="18"/><text class="k" x="77"  y="241">10</text><text class="idx" x="77"  y="270">i=7</text>
  <circle class="n"   cx="153" cy="236" r="18"/><text class="k" x="153" y="241">20</text><text class="idx" x="153" y="270">i=8</text>
  <!-- formula for i = 1 -->
  <text class="note" x="330" y="226">For i = 1 (value 80):</text>
  <text class="note" x="330" y="244" style="fill:#f59e0b;opacity:1">parent (1 − 1) / 2 = 0</text>
  <text class="note" x="330" y="262" style="fill:#10b981;opacity:1">children 2·1 + 1 = 3 and 2·1 + 2 = 4</text>
  <!-- array -->
  <rect class="par"  x="115" y="288" width="50" height="30"/><text class="k" x="140" y="308">90</text>
  <rect class="me"   x="165" y="288" width="50" height="30"/><text class="k" x="190" y="308">80</text>
  <rect class="cell" x="215" y="288" width="50" height="30"/><text class="k" x="240" y="308">70</text>
  <rect class="kid"  x="265" y="288" width="50" height="30"/><text class="k" x="290" y="308">50</text>
  <rect class="kid"  x="315" y="288" width="50" height="30"/><text class="k" x="340" y="308">40</text>
  <rect class="cell" x="365" y="288" width="50" height="30"/><text class="k" x="390" y="308">60</text>
  <rect class="cell" x="415" y="288" width="50" height="30"/><text class="k" x="440" y="308">30</text>
  <rect class="cell" x="465" y="288" width="50" height="30"/><text class="k" x="490" y="308">10</text>
  <rect class="cell" x="515" y="288" width="50" height="30"/><text class="k" x="540" y="308">20</text>
  <text class="idx" x="140" y="333">0</text><text class="idx" x="190" y="333">1</text><text class="idx" x="240" y="333">2</text>
  <text class="idx" x="290" y="333">3</text><text class="idx" x="340" y="333">4</text><text class="idx" x="390" y="333">5</text>
  <text class="idx" x="440" y="333">6</text><text class="idx" x="490" y="333">7</text><text class="idx" x="540" y="333">8</text>
  <text class="idx" x="82" y="308">array</text>
  <!-- level brackets -->
  <path class="br" d="M118,340 v6 h44 v-6"/><text class="lvl" x="140" y="362">level 0</text>
  <path class="br" d="M168,340 v6 h94 v-6"/><text class="lvl" x="215" y="362">level 1</text>
  <path class="br" d="M268,340 v6 h194 v-6"/><text class="lvl" x="365" y="362">level 2</text>
  <path class="br" d="M468,340 v6 h94 v-6"/><text class="lvl" x="515" y="362">level 3</text>
</svg>
