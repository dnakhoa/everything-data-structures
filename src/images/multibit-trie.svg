<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="The same six prefixes stored in a binary trie with four levels and in a stride-2 multibit trie with two levels, with the lookup path for address 1011 highlighted in both" style="max-width:100%;height:auto;color:inherit">
  <style>
    .multibit-trie-n    { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .multibit-trie-p    { fill: #f59e0b; fill-opacity: .18; stroke: #f59e0b; stroke-width: 2; }
    .multibit-trie-cell { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .multibit-trie-e    { stroke: currentColor; stroke-width: 1.5; opacity: .6; fill: none; }
    .multibit-trie-hot  { stroke: #3b82f6; stroke-width: 3; fill: none; }
    .multibit-trie-t    { fill: currentColor; font: 600 12px ui-monospace, monospace; text-anchor: middle; }
    .multibit-trie-b    { fill: currentColor; font: 11px ui-monospace, monospace; text-anchor: middle; opacity: .7; }
    .multibit-trie-cap  { fill: currentColor; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .multibit-trie-note { fill: currentColor; font: 11px system-ui, sans-serif; opacity: .75; }
    .multibit-trie-blue { fill: #3b82f6; font: 600 11px system-ui, sans-serif; }
  </style>
  <text class="multibit-trie-cap" x="175" y="22">Binary trie: 1 bit per level</text>
  <text class="multibit-trie-cap" x="520" y="22">Stride-2 trie: 2 bits per level</text>
  <text class="multibit-trie-note" x="350" y="44" text-anchor="middle">Routes: P1 = 0*, P2 = 1*, P3 = 00*, P4 = 101*, P5 = 111*, P6 = 1000*</text>
  <!-- binary trie edges -->
  <line class="multibit-trie-e" x1="160" y1="80" x2="100" y2="126"/>
  <line class="multibit-trie-hot" x1="180" y1="80" x2="240" y2="126"/>
  <line class="multibit-trie-e" x1="88" y1="148" x2="62" y2="186"/>
  <line class="multibit-trie-hot" x1="242" y1="148" x2="210" y2="186"/>
  <line class="multibit-trie-e" x1="262" y1="148" x2="292" y2="186"/>
  <line class="multibit-trie-e" x1="196" y1="208" x2="172" y2="246"/>
  <line class="multibit-trie-hot" x1="212" y1="208" x2="232" y2="246"/>
  <line class="multibit-trie-e" x1="305" y1="208" x2="318" y2="246"/>
  <line class="multibit-trie-e" x1="162" y1="268" x2="144" y2="306"/>
  <text class="multibit-trie-b" x="118" y="100">0</text>
  <text class="multibit-trie-b" x="222" y="100">1</text>
  <text class="multibit-trie-b" x="64" y="168">0</text>
  <text class="multibit-trie-b" x="216" y="166">0</text>
  <text class="multibit-trie-b" x="288" y="166">1</text>
  <text class="multibit-trie-b" x="174" y="226">0</text>
  <text class="multibit-trie-b" x="232" y="226">1</text>
  <text class="multibit-trie-b" x="320" y="226">1</text>
  <text class="multibit-trie-b" x="144" y="288">0</text>
  <!-- binary trie nodes -->
  <circle class="multibit-trie-n" cx="170" cy="68" r="15"/>
  <circle class="multibit-trie-hot" cx="170" cy="68" r="18"/>
  <circle class="multibit-trie-p" cx="90" cy="136" r="15"/><text class="multibit-trie-t" x="90" y="140">P1</text>
  <circle class="multibit-trie-p" cx="250" cy="136" r="15"/><text class="multibit-trie-t" x="250" y="140">P2</text>
  <circle class="multibit-trie-hot" cx="250" cy="136" r="18"/>
  <circle class="multibit-trie-p" cx="54" cy="198" r="15"/><text class="multibit-trie-t" x="54" y="202">P3</text>
  <circle class="multibit-trie-n" cx="204" cy="198" r="15"/>
  <circle class="multibit-trie-hot" cx="204" cy="198" r="18"/>
  <circle class="multibit-trie-n" cx="298" cy="198" r="15"/>
  <circle class="multibit-trie-n" cx="166" cy="258" r="15"/>
  <circle class="multibit-trie-p" cx="238" cy="258" r="15"/><text class="multibit-trie-t" x="238" y="262">P4</text>
  <circle class="multibit-trie-hot" cx="238" cy="258" r="18"/>
  <circle class="multibit-trie-p" cx="322" cy="258" r="15"/><text class="multibit-trie-t" x="322" y="262">P5</text>
  <circle class="multibit-trie-p" cx="140" cy="318" r="15"/><text class="multibit-trie-t" x="140" y="322">P6</text>
  <text class="multibit-trie-note" x="20" y="358">10 nodes, 4 levels. Lookup 1011 (blue) reads</text>
  <text class="multibit-trie-note" x="20" y="373">a node per bit and stops at 101 with P4.</text>
  <!-- multibit root -->
  <text class="multibit-trie-b" x="425" y="76">00</text>
  <text class="multibit-trie-b" x="485" y="76">01</text>
  <text class="multibit-trie-b" x="545" y="76">10</text>
  <text class="multibit-trie-b" x="605" y="76">11</text>
  <rect class="multibit-trie-cell" x="395" y="82" width="60" height="34"/><text class="multibit-trie-t" x="425" y="103">P3</text>
  <rect class="multibit-trie-cell" x="455" y="82" width="60" height="34"/><text class="multibit-trie-t" x="485" y="103">P1</text>
  <rect class="multibit-trie-cell" x="515" y="82" width="60" height="34"/><text class="multibit-trie-t" x="545" y="103">P2</text>
  <rect class="multibit-trie-cell" x="575" y="82" width="60" height="34"/><text class="multibit-trie-t" x="605" y="103">P2</text>
  <rect class="multibit-trie-hot" x="515" y="82" width="60" height="34"/>
  <circle cx="545" cy="111" r="2.5" fill="currentColor"/>
  <circle cx="605" cy="111" r="2.5" fill="currentColor"/>
  <path class="multibit-trie-hot" d="M545,113 L451,198"/>
  <path class="multibit-trie-e" d="M605,113 L611,198"/>
  <!-- child under 10 -->
  <text class="multibit-trie-b" x="397" y="246">00</text>
  <text class="multibit-trie-b" x="433" y="246">01</text>
  <text class="multibit-trie-b" x="469" y="246">10</text>
  <text class="multibit-trie-b" x="505" y="246">11</text>
  <rect class="multibit-trie-cell" x="379" y="198" width="36" height="32"/><text class="multibit-trie-t" x="397" y="218">P6</text>
  <rect class="multibit-trie-cell" x="415" y="198" width="36" height="32"/><text class="multibit-trie-t" x="433" y="218">·</text>
  <rect class="multibit-trie-cell" x="451" y="198" width="36" height="32"/><text class="multibit-trie-t" x="469" y="218">P4</text>
  <rect class="multibit-trie-cell" x="487" y="198" width="36" height="32"/><text class="multibit-trie-t" x="505" y="218">P4</text>
  <rect class="multibit-trie-hot" x="487" y="198" width="36" height="32"/>
  <!-- child under 11 -->
  <text class="multibit-trie-b" x="557" y="246">00</text>
  <text class="multibit-trie-b" x="593" y="246">01</text>
  <text class="multibit-trie-b" x="629" y="246">10</text>
  <text class="multibit-trie-b" x="665" y="246">11</text>
  <rect class="multibit-trie-cell" x="539" y="198" width="36" height="32"/><text class="multibit-trie-t" x="557" y="218">·</text>
  <rect class="multibit-trie-cell" x="575" y="198" width="36" height="32"/><text class="multibit-trie-t" x="593" y="218">·</text>
  <rect class="multibit-trie-cell" x="611" y="198" width="36" height="32"/><text class="multibit-trie-t" x="629" y="218">P5</text>
  <rect class="multibit-trie-cell" x="647" y="198" width="36" height="32"/><text class="multibit-trie-t" x="665" y="218">P5</text>
  <text class="multibit-trie-note" x="379" y="272">P2 = 1* is expanded into slots 10 and 11.</text>
  <text class="multibit-trie-note" x="379" y="288">P3 = 00* overrides P1 = 0* in slot 00: longer wins.</text>
  <text class="multibit-trie-note" x="379" y="304">P4 = 101* fills two slots, 1010 and 1011.</text>
  <text class="multibit-trie-note" x="379" y="320">An empty slot (·) falls back to the best match</text>
  <text class="multibit-trie-note" x="379" y="336">remembered from the level above.</text>
  <text class="multibit-trie-note" x="379" y="358">3 nodes, 2 levels. Lookup 1011 reads</text>
  <text class="multibit-trie-blue" x="379" y="373">2 slots: P2, then P4.</text>
</svg>
