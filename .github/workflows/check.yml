name: Check book

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Book integrity checks
        run: python3 scripts/check_book.py

      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Build (warnings are failures)
        run: |
          mdbook build 2>build.log || { cat build.log; exit 1; }
          cat build.log
          if grep -q "WARN" build.log; then
            echo "::error::mdBook emitted warnings — see log above"
            exit 1
          fi
