<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  <g opacity=".13" stroke="#93c5fd" fill="none" stroke-width="2">
    <line x1="1010" y1="150" x2="930" y2="228"/>
    <line x1="1010" y1="150" x2="1090" y2="228"/>
    <line x1="930" y1="240" x2="880" y2="318"/>
    <line x1="930" y1="240" x2="980" y2="318"/>
    <line x1="1090" y1="240" x2="1040" y2="318"/>
    <line x1="1090" y1="240" x2="1140" y2="318"/>
    <line x1="880" y1="330" x2="850" y2="408"/>
    <line x1="880" y1="330" x2="910" y2="408"/>
    <line x1="1140" y1="330" x2="1110" y2="408"/>
    <line x1="1140" y1="330" x2="1170" y2="408"/>
    <circle cx="1010" cy="138" r="26"/>
    <circle cx="930" cy="234" r="26"/>
    <circle cx="1090" cy="234" r="26"/>
    <circle cx="880" cy="324" r="22"/>
    <circle cx="980" cy="324" r="22"/>
    <circle cx="1040" cy="324" r="22"/>
    <circle cx="1140" cy="324" r="22"/>
    <circle cx="850" cy="414" r="18"/>
    <circle cx="910" cy="414" r="18"/>
    <circle cx="1110" cy="414" r="18"/>
    <circle cx="1170" cy="414" r="18"/>
