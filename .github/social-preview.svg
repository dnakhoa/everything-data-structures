  <text x="80" y="170" fill="#e2e8f0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="700">Everything</text>
  <text x="80" y="256" fill="#e2e8f0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="700">Data Structures</text>
  <rect x="80" y="292" width="88" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="352" fill="#94a3b8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29">A complete free course — from Big-O to distributed systems.</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="80" y="396" width="152" height="46" rx="23" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-opacity=".5"/>
    <text x="156" y="426" fill="#93c5fd" font-size="21" text-anchor="middle">5 volumes</text>
    <rect x="246" y="396" width="168" height="46" rx="23" fill="#10b981" fill-opacity=".16" stroke="#10b981" stroke-opacity=".5"/>
    <text x="330" y="426" fill="#6ee7b7" font-size="21" text-anchor="middle">31 chapters</text>
    <rect x="428" y="396" width="196" height="46" rx="23" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-opacity=".5"/>
    <text x="526" y="426" fill="#fcd34d" font-size="21" text-anchor="middle">40,000 words</text>
  </g>
  <text x="80" y="514" fill="#64748b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22">Arrays → B-trees → link-cut trees → FM-indexes → CRDTs → Spanner, Dynamo, Kafka</text>
  <text x="80" y="576" fill="#475569" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21">github.com/dnakhoa/everything-data-structures</text>
  <text x="1200" y="576" fill="#475569" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" text-anchor="end">Ngoc Anh Khoa Doan</text>
