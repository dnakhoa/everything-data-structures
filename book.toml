[book]
title = "Everything Data Structures"
description = "A complete course on data structures — from asymptotic analysis to distributed systems, in five volumes and 31 chapters."
authors = ["Ngoc Anh Khoa Doan"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
additional-css = ["theme/custom.css"]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/dnakhoa/everything-data-structures"
edit-url-template = "https://github.com/dnakhoa/everything-data-structures/edit/main/{path}"
site-url = "/everything-data-structures/"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.print]
enable = true
